name: Radar Diario de Empleos

on:
  schedule:
    - cron: '30 11 * * *'  # 11:30 UTC = 08:30 AM hora Chile
  workflow_dispatch:        # Permite ejecutarlo manualmente cuando quieras probarlo

permissions:
  contents: write           # Necesario para guardar el historial de ofertas vistas

jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Ejecutar buscador
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: python buscador.py
      - name: Guardar historial de ofertas
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add historial_ofertas.json
          git commit -m "Actualizar historial" || exit 0
          git push
