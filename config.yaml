ubicacion: "Chile"
horas_antiguedad: 48
max_anos_experiencia: 2       # Bloquea ofertas que pidan 2 o más años de experiencia
excluir_practicas: true       # Bloquea prácticas profesionales y memorias de título

# 1. Búsquedas dirigidas a tus fortalezas técnicas
